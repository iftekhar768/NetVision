{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Device</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Device Name</label>
                    <input
                        type="text"
                        class="form-control"
                        name="name"
                        value="{{ device.name }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">IP Address</label>
                    <input
                        type="text"
                        class="form-control"
                        name="ip_address"
                        value="{{ device.ip_address }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input
                        type="text"
                        class="form-control"
                        name="location"
                        value="{{ device.location }}">
                </div>

                <button type="submit" class="btn btn-success">
                    Save Changes
                </button>

                <a href="/devices" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
