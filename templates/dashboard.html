{% extends "base.html" %}

{% block content %}

<h2>Network Dashboard</h2>

<hr>

<div class="row">

    <!-- Online -->
    <div class="col-md-4">
        <div class="card text-bg-success">
            <div class="card-body">
                <h5>Online Devices</h5>
                <h1>{{ online }}</h1>
            </div>
        </div>
    </div>

    <!-- Offline -->
    <div class="col-md-4">
        <div class="card text-bg-danger">
            <div class="card-body">
                <h5>Offline Devices</h5>
                <h1>{{ offline }}</h1>
            </div>
        </div>
    </div>

    <!-- Total -->
    <div class="col-md-4">
        <div class="card text-bg-primary">
            <div class="card-body">
                <h5>Total Devices</h5>
                <h1>{{ total }}</h1>
            </div>
        </div>
    </div>

</div>

{% endblock %}
