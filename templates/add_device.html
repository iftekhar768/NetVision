{% extends "base.html" %}

{% block content %}

<h2>Add New Device</h2>

<hr>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Device Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">IP Address</label>
        <input
            type="text"
            name="ip_address"
            class="form-control"
            placeholder="192.168.1.1"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Location</label>
        <input
            type="text"
            name="location"
            class="form-control">
    </div>

    <button class="btn btn-success">
        Save Device
    </button>

    <a href="/devices" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
